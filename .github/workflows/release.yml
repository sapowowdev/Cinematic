name: Package and release

# Runs when you push a version tag such as v1.0.1.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets it create the GitHub release too
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager needs history for the changelog

      # Every commit, for the What's new > All changes page
      - run: bash Tools/commits.sh ChangelogCommits.lua

      - uses: BigWigsMods/packager@v2

      # The release's new features to the Discord channel, with a link to the
      # patch notes page; posts nothing until the DISCORD_WEBHOOK secret is set.
      - run: python3 Tools/discord_notes.py "$GITHUB_REF_NAME"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
